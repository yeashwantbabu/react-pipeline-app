version: 0.2

phases:

  install:
    runtime-versions:
      nodejs: 18
    commands:
      - node --version
      - npm --version
      - npm install

  pre_build:
    commands:
      - echo "Project $PROJECT"
      - echo "Environment $ENVIRONMENT"
      - echo "NodeEnv $NODE_ENV"

  build:
    commands:
      - npm run build
      - echo "React build complete."

  post_build:
    commands:
      - ls -la build/
      - echo "Build packaged and ready for CodeDeploy."

artifacts:
  files:
    - "build/**/*"
    - appspec.yml
    - "scripts/**/*"
  discard-paths: no

cache:
  paths:
    - node_modules/**/*
