version: 0.0
os: linux

# Copy React build output to nginx web root
files:
  - source: build/
    destination: /var/www/html/
    overwrite: true

permissions:
  - object: /var/www/html/
    pattern: "**"
    owner: nginx
    group: nginx
    mode: 755
    type:
      - file
      - directory

hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 120
      runas: root

  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 120
      runas: root

  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 60
      runas: root

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 60
      runas: root
